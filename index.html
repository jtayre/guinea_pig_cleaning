<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guinea Pig Cleaning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
    text-align: center;
  }

  h2 { margin-bottom: 10px; }

  .buttons { margin-bottom: 15px; }

  button, input[type="file"] {
    margin: 0 5px 10px 5px;
    padding: 10px 15px;
    font-size: 16px;
    cursor: pointer;
  }

  /* Outer layout so top and bottom share the same width */
  .layout {
    display: flex;
    justify-content: center;
  }

  /* This defines the overall rectangle width */
  .layout-inner {
    width: calc(2 * 140px + 10px); /* 2 cells of 140px + 10px gap */
  }

  /* Top 4x2 grid (landscape cells) */
  .grid-top {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 60px;
    gap: 10px;
    width: 100%;
  }

  /* Bottom row of 3 portrait cells */
  .bottom-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
    width: 100%;
  }

  .cell {
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid #ccc;
    cursor: pointer;
    flex-direction: column;
    font-size: 14px;
    color: white;
    box-sizing: border-box;
  }

  /* “Landscape” rectangles (top 4×2) */
  .cell.horizontal {
    height: 60px;
  }

  /* “Portrait / rotated” rectangles (bottom 3) */
  .cell.vertical {
    height: 140px;  /* taller than wide → portrait look */
  }

  input[type="date"] {
    width: 120px;
    font-size: 14px;
  }
</style>
</head>
<body>

<h2>Guinea Pig Cleaning</h2>
<div class="buttons">
  <input type="file" id="loadFile" accept=".json">
  <button id="export">Export</button>
</div>

<div class="layout">
  <div class="layout-inner">
    <!-- Top 4x2 grid -->
    <div class="grid-top" id="gridTop"></div>

    <!-- Bottom row of 3 portrait boxes -->
    <div class="bottom-row" id="bottomRow"></div>
  </div>
</div>

<script>
// Configuration
const TOP_ROWS = 4;
const TOP_COLS = 2;
const BOTTOM_COUNT = 3;

const topGrid   = document.getElementById("gridTop");
const bottomRow = document.getElementById("bottomRow");
let dates = {};

// Parse YYYY-MM-DD safely
function parseDateYMD(dateStr) {
  const parts = dateStr.split("-");
  return new Date(parts[0], parts[1] - 1, parts[2]); // year, monthIndex, day
}

// Determine cell color based on age and rules
// Top grid: original "top" rules
// Bottom row: original "bottom 2 rows" rules
function getCellColor(cellId, dateStr) {
  if (!dateStr) return "#eee"; // no date
  const date = parseDateYMD(dateStr);
  const today = new Date();
  const todayNormalized = new Date(
    today.getFullYear(),
    today.getMonth(),
    today.getDate()
  );
  const diffDays = Math.floor(
    (todayNormalized - date) / (1000 * 60 * 60 * 24)
  );

  const isBottom = cellId.startsWith("bottom-");

  if (!isBottom) {
    // Top 4x2 (original "top" rules)
    if (diffDays >= 7) return "red";
    if (diffDays >= 4) return "orange";
    return "green";
  } else {
    // Bottom 3 portrait boxes (original bottom rules)
    if (diffDays >= 4) return "red";
    if (diffDays >= 2) return "orange";
    return "green";
  }
}

// Create a single cell and hook up events
function createCell(id, orientation) {
  const div = document.createElement("div");
  div.className = `cell ${orientation}`;
  div.id = id;

  const label = document.createElement("span");
  label.innerText = dates[id] || "Set Date";
  div.appendChild(label);

  // Apply correct background color
  div.style.backgroundColor = getCellColor(id, dates[id]);

  div.addEventListener("click", () => {
    // Prevent multiple inputs in same cell
    if (div.querySelector("input[type='date']")) return;

    const input = document.createElement("input");
    input.type = "date";
    input.value = dates[id] || "";
    input.addEventListener("change", () => {
      dates[id] = input.value;
      label.innerText = input.value || "Set Date";
      div.style.backgroundColor = getCellColor(id, input.value);
      div.removeChild(input);
      localStorage.setItem("lastDates", JSON.stringify(dates));
    });

    div.appendChild(input);
    input.focus();
  });

  return div;
}

// Create grid and bottom row
function createLayout() {
  topGrid.innerHTML = "";
  bottomRow.innerHTML = "";

  // Top 4x2
  for (let r = 0; r < TOP_ROWS; r++) {
    for (let c = 0; c < TOP_COLS; c++) {
      const id = `top-${r},${c}`;
      const cell = createCell(id, "horizontal");
      topGrid.appendChild(cell);
    }
  }

  // Bottom row of 3 portrait boxes
  for (let i = 0; i < BOTTOM_COUNT; i++) {
    const id = `bottom-${i}`;
    const cell = createCell(id, "vertical");
    bottomRow.appendChild(cell);
  }
}

// Load last JSON from localStorage on page load
window.addEventListener("load", () => {
  const saved = localStorage.getItem("lastDates");
  if (saved) {
    dates = JSON.parse(saved);
  }
  createLayout();
});

// Manual import
document.getElementById("loadFile").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      dates = JSON.parse(e.target.result);
      createLayout();
      localStorage.setItem("lastDates", JSON.stringify(dates));
    } catch (err) {
      alert("Invalid JSON file");
    }
  };
  reader.readAsText(file);
});

// Export JSON with filename prompt
document.getElementById("export").addEventListener("click", () => {
  const fileName = prompt("Enter filename for export:", "dates.json");
  if (!fileName) return;

  const blob = new Blob([JSON.stringify(dates, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(url);

  alert(`JSON exported as "${fileName}". Save it to your shared OneDrive folder for syncing.`);
});
</script>

</body>
</html>
